# render.yaml — Darukaa.Earth Infrastructure as Code for Render.com
# Docs: https://render.com/docs/infrastructure-as-code
#
# HOW TO USE:
# 1. Push this file to your GitHub repo (root level)
# 2. Go to render.com → New → Blueprint → connect your repo
# 3. Render will auto-create all services below
# 4. Copy the deploy hook URLs from each service → add as GitHub Secrets:
#    - RENDER_BACKEND_DEPLOY_HOOK
#    - RENDER_FRONTEND_DEPLOY_HOOK

services:
  # ── Backend: FastAPI Python API ─────────────────────────────────────────────
  - type: web
    name: darukaa-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install --upgrade pip setuptools && pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: darukaa-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: PROJECT_NAME
        value: "Darukaa.Earth Platform"
      - key: API_V1_STR
        value: "/api/v1"
      - key: MAPBOX_ACCESS_TOKEN
        sync: false   # Set manually in Render dashboard

  # ── Frontend: React + Vite Static Site ──────────────────────────────────────
  - type: web
    name: darukaa-frontend
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: "npm ci && npm run build"
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://darukaa-backend.onrender.com/api/v1
      - key: VITE_MAPBOX_TOKEN
        sync: false   # Set manually in Render dashboard

# ── PostgreSQL + PostGIS Database ─────────────────────────────────────────────
databases:
  - name: darukaa-postgres
    databaseName: darukaa
    user: darukaa_user
    region: oregon
    plan: free
    # Note: Render's free PostgreSQL does not include PostGIS by default.
    # After provisioning, run the following in the Render shell or psql:
    #   CREATE EXTENSION IF NOT EXISTS postgis;
