version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: darukaa_postgis
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: darukaa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d darukaa"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: darukaa_backend
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgrespassword@db:5432/darukaa
      SECRET_KEY: darukaa-production-jwt-secret-key-2025
      PROJECT_NAME: "Darukaa.Earth Platform"
      API_V1_STR: "/api/v1"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: darukaa_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
